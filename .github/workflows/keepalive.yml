name: Keep Scheduled Workflows Active

on:
  schedule:
    # Creates lightweight repository activity monthly so scheduled workflows
    # are not disabled after 60 days of inactivity.
    - cron: '43 3 15 * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update heartbeat
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-activity.txt

      - name: Commit heartbeat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-activity.txt
          git commit -m "chore: keep scheduled workflows active" || exit 0
          git push
